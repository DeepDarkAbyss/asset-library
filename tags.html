<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tags — Rei's Asset Library</title>

    <link
    rel="stylesheet"
    href="style.css"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
    
</head>


<body>


<header class="topbar">

    <div class="logo">

        <a
            href="index.html"
            style="text-decoration:none;color:inherit;"
        >

            <span class="logo-main">
                REI'S ASSET LIBRARY
            </span>

            <span class="logo-sub">
                PERSONAL ARCHIVE
            </span>

        </a>

    </div>


   <nav class="nav">

    <a
        class="nav-link"
        href="index.html"
    >
        ASSETS
    </a>

    <a
        class="nav-link active"
        href="tags.html"
    >
        TAGS
    </a>

</nav>

</header>


<main>


    <section class="header">

        <h1 class="header-title">
            TAG INDEX
        </h1>

        <p class="header-subtitle">
            Every tag currently used in the archive.
        </p>

    </section>


    <section
        class="tags-page"
        id="tagList"
    >

        <div class="no-results">
            LOADING TAGS...
        </div>

    </section>


</main>


<script>

async function loadTags() {

    const container =
        document.getElementById("tagList");


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("assets")
            .select("tags");


        if (error) {
            throw error;
        }


        const tagCounts = {};


        (data || []).forEach(asset => {

            (asset.tags || []).forEach(rawTag => {

                const tag =
                    rawTag
                        .trim()
                        .toLowerCase();


                if (!tag) {
                    return;
                }


                tagCounts[tag] =
                    (tagCounts[tag] || 0) + 1;

            });

        });


        const groups = {};


        Object.entries(tagCounts).forEach(
            ([tag, count]) => {

                const separatorIndex =
                    tag.indexOf(":");


                let group;
                let value;


                if (separatorIndex !== -1) {

                    group =
                        tag
                            .slice(
                                0,
                                separatorIndex
                            )
                            .trim();

                    value =
                        tag
                            .slice(
                                separatorIndex + 1
                            )
                            .trim();

                } else {

                    group =
                        "uncategorized";

                    value =
                        tag;

                }


                if (!group) {
                    group = "uncategorized";
                }


                if (!value) {
                    value = tag;
                }


                if (!groups[group]) {

                    groups[group] = [];

                }


                groups[group].push({
                    fullTag: tag,
                    value,
                    count
                });

            }
        );


        container.innerHTML = "";


        const sortedGroups =
            Object.entries(groups)
                .sort(
                    (a, b) =>
                        a[0].localeCompare(
                            b[0]
                        )
                );


        sortedGroups.forEach(
            ([group, tags]) => {

                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "tag-group";


                const heading =
                    document.createElement(
                        "h2"
                    );


                heading.className =
                    "tag-group-title";


                heading.textContent =
                    group === "uncategorized"
                        ? "UNCATEGORIZED"
                        : group.toUpperCase();


                section.appendChild(
                    heading
                );


                const list =
                    document.createElement(
                        "div"
                    );


                list.className =
                    "tag-group-list";


                tags
                    .sort(
                        (a, b) =>
                            a.value.localeCompare(
                                b.value
                            )
                    )
                    .forEach(
                        tag => {

                            const link =
                                document.createElement(
                                    "a"
                                );


                            link.className =
                                "tag-index-item";


                            link.href =
                                `index.html?tag=${encodeURIComponent(
                                    tag.fullTag
                                )}`;


                            link.innerHTML = `
                                <span class="tag-index-name">
                                    ${tag.value.toUpperCase()}
                                </span>

                                <span class="tag-index-count">
                                    ${tag.count}
                                </span>
                            `;


                            list.appendChild(
                                link
                            );

                        }
                    );


                section.appendChild(
                    list
                );


                container.appendChild(
                    section
                );

            }
        );


        if (
            sortedGroups.length === 0
        ) {

            container.innerHTML = `
                <div class="no-results">
                    NO TAGS FOUND
                </div>
            `;

        }


    } catch (error) {

        console.error(
            "Failed to load tags:",
            error
        );


        container.innerHTML = `
            <div class="no-results">
                FAILED TO LOAD TAGS
            </div>
        `;

    }

}

loadTags();
    
</script>


</body>

</html>
