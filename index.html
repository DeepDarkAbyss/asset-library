<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rei's Asset Library</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="topbar">


    <div class="logo">

        <span class="logo-main">
            REI'S ASSET LIBRARY
        </span>

        <span class="logo-sub">
            PERSONAL ARCHIVE
        </span>

    </div>


    <div class="search-wrap">

        <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="SEARCH THE ARCHIVE..."
        >

    </div>


    <div class="top-actions">

        <button
            class="button"
            id="addButton"
        >
            + ADD ASSET
        </button>

    </div>


</header>


<main>


    <section class="header">

        <h1 class="header-title">
            ASSET ARCHIVE
        </h1>

        <p class="header-subtitle">
            Brushes, materials, textures and everything else I refuse to lose.
        </p>

    </section>


    <section class="toolbar">


        <button
            class="filter-button active"
            data-filter="all"
        >
            ALL
        </button>


        <button
            class="filter-button"
            data-filter="brush"
        >
            BRUSHES
        </button>


        <button
            class="filter-button"
            data-filter="material"
        >
            MATERIALS
        </button>


        <button
            class="filter-button"
            data-filter="texture"
        >
            TEXTURES
        </button>


        <button
            class="filter-button"
            data-filter="3d"
        >
            3D
        </button>


        <select
            class="filter-select"
            id="softwareFilter"
        >

            <option value="all">
                ALL SOFTWARE
            </option>

            <option value="csp">
                CLIP STUDIO PAINT
            </option>

            <option value="ps">
                PHOTOSHOP
            </option>

            <option value="other">
                OTHER
            </option>

        </select>


    </section>


    <section
        class="asset-grid"
        id="assetGrid"
    ></section>


</main>


<div
    class="modal"
    id="assetModal"
>


    <div class="modal-window">


        <div class="modal-header">

            <span class="modal-label">
                ASSET DETAILS
            </span>


            <button
                class="close-button"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <div class="modal-content">


            <div class="modal-preview">

                <div
                    class="modal-placeholder"
                    id="modalPreview"
                >
                    PREVIEW
                </div>

            </div>


            <div class="modal-info">


                <div
                    class="modal-type"
                    id="modalType"
                ></div>


                <h2
                    class="modal-title"
                    id="modalTitle"
                ></h2>


                <p
                    class="modal-description"
                    id="modalDescription"
                ></p>


                <div class="modal-section">


                    <div class="modal-section-title">
                        TAGS
                    </div>


                    <div
                        class="tags"
                        id="modalTags"
                    ></div>


                </div>


                <div class="modal-section">


                    <div class="modal-section-title">
                        LINKS
                    </div>


                    <div class="modal-actions">


                        <a
                            class="button"
                            id="sourceButton"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            SOURCE
                        </a>


                        <a
                            class="button"
                            id="downloadButton"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            DOWNLOAD
                        </a>


                    </div>


                </div>


            </div>


        </div>


    </div>


</div>


<script>


let assets = [];

let activeType = "all";


const searchInput =
    document.getElementById("searchInput");


const assetGrid =
    document.getElementById("assetGrid");


const softwareFilter =
    document.getElementById("softwareFilter");


const filterButtons =
    document.querySelectorAll(".filter-button");


const modal =
    document.getElementById("assetModal");


const closeModal =
    document.getElementById("closeModal");


const modalTitle =
    document.getElementById("modalTitle");


const modalType =
    document.getElementById("modalType");


const modalDescription =
    document.getElementById("modalDescription");


const modalPreview =
    document.getElementById("modalPreview");


const modalTags =
    document.getElementById("modalTags");


const sourceButton =
    document.getElementById("sourceButton");


const downloadButton =
    document.getElementById("downloadButton");



async function loadAssets() {

    try {

        const response =
            await fetch("assets.json");


        if (!response.ok) {

            throw new Error(
                "Could not load assets.json"
            );

        }


        assets =
            await response.json();


        renderAssets();

    } catch (error) {

        console.error(error);

        assetGrid.innerHTML = `
            <div class="no-results">
                FAILED TO LOAD ASSETS
            </div>
        `;

    }

}



function createTagElement(tag) {

    const element =
        document.createElement("span");

    element.className =
        "tag";

    element.textContent =
        tag.toUpperCase();

    return element;

}



function createPreview(asset) {

    const container =
        document.createElement("div");

    container.className =
        "asset-preview";


    if (asset.preview) {

        const image =
            document.createElement("img");

        image.src =
            asset.preview;

        image.alt =
            asset.name;

        image.style.width =
            "100%";

        image.style.height =
            "100%";

        image.style.objectFit =
            "contain";


        container.appendChild(image);

    } else {

        const placeholder =
            document.createElement("div");

        placeholder.className =
            "preview-placeholder";

        placeholder.textContent =
            "PREVIEW";


        container.appendChild(
            placeholder
        );

    }


    return container;

}



function renderAssets() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const software =
        softwareFilter.value;


    assetGrid.innerHTML = "";


    const filtered =
        assets.filter(asset => {


            const matchesType =
                activeType === "all" ||
                asset.type === activeType;


            const matchesSoftware =
                software === "all" ||
                asset.software === software;


            const searchable = [
                asset.name,
                asset.description,
                asset.typeLabel,
                asset.software,
                ...asset.tags
            ]
                .join(" ")
                .toLowerCase();


            const matchesSearch =
                searchable.includes(search);


            return (
                matchesType &&
                matchesSoftware &&
                matchesSearch
            );

        });



    if (filtered.length === 0) {

        assetGrid.innerHTML = `
            <div class="no-results">
                NO ASSETS FOUND
            </div>
        `;

        return;

    }



    filtered.forEach(asset => {


        const card =
            document.createElement("article");


        card.className =
            "asset-card";


        card.appendChild(
            createPreview(asset)
        );



        const info =
            document.createElement("div");


        info.className =
            "asset-info";



        const type =
            document.createElement("div");


        type.className =
            "asset-type";


        type.textContent =
            asset.typeLabel;



        const name =
            document.createElement("h2");


        name.className =
            "asset-name";


        name.textContent =
            asset.name;



        const description =
            document.createElement("p");


        description.className =
            "asset-description";


        description.textContent =
            asset.description;



        const footer =
            document.createElement("div");


        footer.className =
            "asset-footer";



        const tags =
            document.createElement("div");


        tags.className =
            "tags";



        asset.tags
            .slice(0, 3)
            .forEach(tag => {

                tags.appendChild(
                    createTagElement(tag)
                );

            });



        const count =
            document.createElement("span");


        count.className =
            "asset-count";


        count.textContent =
            "#" +
            String(asset.id)
                .padStart(3, "0");



        footer.appendChild(tags);

        footer.appendChild(count);



        info.appendChild(type);

        info.appendChild(name);

        info.appendChild(description);

        info.appendChild(footer);



        card.appendChild(info);



        card.addEventListener(
            "click",
            () => openModal(asset)
        );



        assetGrid.appendChild(card);

    });

}



function openModal(asset) {

    modalTitle.textContent =
        asset.name;


    modalType.textContent =
        asset.typeLabel;


    modalDescription.textContent =
        asset.description;


    modalTags.innerHTML = "";


    asset.tags.forEach(tag => {

        modalTags.appendChild(
            createTagElement(tag)
        );

    });



    modalPreview.innerHTML = "";



    if (asset.preview) {

        const image =
            document.createElement("img");

        image.src =
            asset.preview;

        image.alt =
            asset.name;

        image.style.width =
            "100%";

        image.style.height =
            "100%";

        image.style.objectFit =
            "contain";


        modalPreview.appendChild(
            image
        );

    } else {

        const placeholder =
            document.createElement("div");

        placeholder.className =
            "modal-placeholder";

        placeholder.textContent =
            "PREVIEW";


        modalPreview.appendChild(
            placeholder
        );

    }



    if (asset.source) {

        sourceButton.href =
            asset.source;

        sourceButton.style.display =
            "inline-flex";

    } else {

        sourceButton.style.display =
            "none";

    }



    if (asset.download) {

        downloadButton.href =
            asset.download;

        downloadButton.style.display =
            "inline-flex";

    } else {

        downloadButton.style.display =
            "none";

    }



    modal.classList.add(
        "open"
    );

}



function closeAssetModal() {

    modal.classList.remove(
        "open"
    );

}



searchInput.addEventListener(
    "input",
    renderAssets
);



softwareFilter.addEventListener(
    "change",
    renderAssets
);



filterButtons.forEach(button => {

    button.addEventListener(
        "click",
        () => {


            filterButtons.forEach(
                item =>
                    item.classList.remove(
                        "active"
                    )
            );


            button.classList.add(
                "active"
            );


            activeType =
                button.dataset.filter;


            renderAssets();

        }
    );

});



closeModal.addEventListener(
    "click",
    closeAssetModal
);



modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeAssetModal();

        }

    }
);



document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            modal.classList.contains("open")
        ) {

            closeAssetModal();

        }

    }
);



loadAssets();

</script>


</body>

</html>
