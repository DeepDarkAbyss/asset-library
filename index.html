    let selectedTagValues = [];


function getAllExistingTags() {

    const tagSet =
        new Set();


    assets.forEach(asset => {

        (asset.tags || []).forEach(tag => {

            const normalized =
                tag.trim().toLowerCase();


            if (normalized) {
                tagSet.add(normalized);
            }

        });

    });


    return Array.from(tagSet)
        .sort((a, b) =>
            a.localeCompare(b)
        );

}



function renderSelectedTags() {

    selectedTags.innerHTML = "";


    selectedTagValues.forEach(tag => {

        const chip =
            document.createElement("span");


        chip.className =
            "selected-tag";


        chip.textContent =
            tag;


        const removeButton =
            document.createElement("button");


        removeButton.className =
            "selected-tag-remove";


        removeButton.type =
            "button";


        removeButton.textContent =
            "×";


        removeButton.addEventListener(
            "click",
            () => {

                selectedTagValues =
                    selectedTagValues.filter(
                        item => item !== tag
                    );


                renderSelectedTags();

                renderTagSuggestions();

            }
        );


        chip.appendChild(
            removeButton
        );


        selectedTags.appendChild(
            chip
        );

    });

}



function addTag(tag) {

    const normalized =
        tag
            .trim()
            .toLowerCase();


    if (!normalized) {
        return;
    }


    if (
        selectedTagValues.includes(
            normalized
        )
    ) {

        tagInput.value = "";

        renderTagSuggestions();

        return;

    }


    selectedTagValues.push(
        normalized
    );


    tagInput.value = "";


    renderSelectedTags();

    renderTagSuggestions();

}



function renderTagSuggestions() {

    const query =
        tagInput.value
            .trim()
            .toLowerCase();


    const existingTags =
        getAllExistingTags();


    const matches =
        existingTags.filter(tag =>
            tag.includes(query) &&
            !selectedTagValues.includes(tag)
        );


    tagSuggestions.innerHTML = "";


    if (
        !query &&
        matches.length === 0
    ) {

        tagSuggestions.classList.remove(
            "open"
        );

        return;

    }


    matches
        .slice(0, 8)
        .forEach(tag => {

            const button =
                document.createElement("button");


            button.type =
                "button";


            button.className =
                "tag-suggestion";


            button.innerHTML = `
                <span>#${tag.toUpperCase()}</span>
            `;


            button.addEventListener(
                "click",
                () => {

                    addTag(tag);

                }
            );


            tagSuggestions.appendChild(
                button
            );

        });


    const exactMatch =
        existingTags.includes(query);


    if (
        query &&
        !exactMatch &&
        !selectedTagValues.includes(query)
    ) {

        const createButton =
            document.createElement("button");


        createButton.type =
            "button";


        createButton.className =
            "tag-suggestion tag-suggestion-create";


        createButton.innerHTML = `
            <span>+ CREATE #${query.toUpperCase()}</span>
        `;


        createButton.addEventListener(
            "click",
            () => {

                addTag(query);

            }
        );


        tagSuggestions.appendChild(
            createButton
        );

    }


    if (
        tagSuggestions.children.length > 0
    ) {

        tagSuggestions.classList.add(
            "open"
        );

    } else {

        tagSuggestions.classList.remove(
            "open"
        );

    }

}



tagInput.addEventListener(
    "input",
    renderTagSuggestions
);

async function loadAssets() {

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("assets")
            .select("*")
            .order("id", {
                ascending: true
            });


        if (error) {
            throw error;
        }


        assets =
    (data || []).map(asset => ({
        ...asset,
        typeLabel:
            getTypeLabel(
                asset.type,
                asset.software
            )
    }));


        updateTagFilter();

        renderAssets();


    } catch (error) {

        console.error(
            "Failed to load assets:",
            error
        );


        assetGrid.innerHTML = `
            <div class="no-results">
                FAILED TO LOAD ASSETS
            </div>
        `;

    }

}



function createTagLink(tag) {

    const link =
        document.createElement("a");


    link.className =
        "tag tag-link";


    link.href =
        `index.html?tag=${encodeURIComponent(tag)}`;


    link.textContent =
        tag.toUpperCase();


    link.addEventListener(
        "click",
        event => {

            event.stopPropagation();

        }
    );


    return link;

}



function createPreview(asset) {

    const container =
        document.createElement("div");


    container.className =
        "asset-preview";


    if (asset.preview) {

        const image =
            document.createElement("img");


        image.src =
            asset.preview;


        image.alt =
            asset.name;


        image.className =
            "asset-image";


        container.appendChild(
            image
        );


    } else {

        const placeholder =
            document.createElement("div");


        placeholder.className =
            "preview-placeholder";


        placeholder.textContent =
            "PREVIEW";


        container.appendChild(
            placeholder
        );

    }


    return container;

}



function updateTagFilter() {

    activeTagFilter.innerHTML = "";


    if (
        !activeTag &&
        !activeAuthor
    ) {

        archiveSubtitle.textContent =
            "Brushes, materials, textures and everything else I refuse to lose.";

        return;

    }


    archiveSubtitle.textContent =
        "Showing assets filtered by tag or author.";


    if (activeTag) {

        const tagLabel =
            document.createElement("span");

        tagLabel.className =
            "active-tag-label";

        tagLabel.textContent =
            `TAG: #${activeTag.toUpperCase()}`;


        const clearTag =
            document.createElement("button");

        clearTag.className =
            "active-tag-clear";

        clearTag.textContent =
            "×";

        clearTag.title =
            "Clear tag filter";


        clearTag.addEventListener(
            "click",
            clearActiveTag
        );


        tagLabel.appendChild(
            clearTag
        );


        activeTagFilter.appendChild(
            tagLabel
        );

    }


    if (activeAuthor) {

        const authorLabel =
            document.createElement("span");

        authorLabel.className =
            "active-tag-label";

        authorLabel.textContent =
            `AUTHOR: ${activeAuthor.toUpperCase()}`;


        const clearAuthor =
            document.createElement("button");

        clearAuthor.className =
            "active-tag-clear";

        clearAuthor.textContent =
            "×";

        clearAuthor.title =
            "Clear author filter";


        clearAuthor.addEventListener(
            "click",
            clearActiveAuthor
        );


        authorLabel.appendChild(
            clearAuthor
        );


        activeTagFilter.appendChild(
            authorLabel
        );

    }

}



function clearActiveTag() {

    activeTag = null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "tag"
    );


    window.history.pushState(
        {},
        "",
        url
    );


    updateTagFilter();

    renderAssets();

}

    function clearActiveAuthor() {

    activeAuthor = null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "author"
    );


    window.history.pushState(
        {},
        "",
        url
    );


    updateTagFilter();

    renderAssets();

}



function renderAssets() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const software =
        softwareFilter.value;


    assetGrid.innerHTML = "";


    const filtered =
        assets.filter(asset => {


            const matchesType =
                activeType === "all" ||
                asset.type === activeType;


            const matchesSoftware =
                software === "all" ||
                asset.software === software;


            const matchesTag =
                !activeTag ||
                asset.tags.some(
                    tag =>
                        tag.trim().toLowerCase() ===
                        activeTag
                );

            const matchesAuthor =
                !activeAuthor ||
                (
                    asset.author &&
                    asset.author.trim().toLowerCase() ===
                    activeAuthor
                );


           const searchable = [
                asset.name,
                asset.description,
                asset.typeLabel,
                asset.software,
                asset.author,
                ...asset.tags
            ]
                .join(" ")
                .toLowerCase();


            const matchesSearch =
                searchable.includes(
                    search
                );


           return (
                matchesType &&
                matchesSoftware &&
                matchesTag &&
                matchesAuthor &&
                matchesSearch
            );

        });



    if (filtered.length === 0) {

        assetGrid.innerHTML = `
            <div class="no-results">
                NO ASSETS FOUND
            </div>
        `;

        return;

    }



    filtered.forEach(asset => {


        const card =
            document.createElement("article");


        card.className =
            "asset-card";



        card.appendChild(
            createPreview(asset)
        );



        const info =
            document.createElement("div");


        info.className =
            "asset-info";



        const type =
            document.createElement("div");


        type.className =
            "asset-type";


        type.textContent =
            asset.typeLabel;



        const name =
            document.createElement("h2");


        name.className =
            "asset-name";


        name.textContent =
            asset.name;



        const description =
            document.createElement("p");


        description.className =
            "asset-description";


        description.textContent =
            asset.description;



        const footer =
            document.createElement("div");


        footer.className =
            "asset-footer";



        const tags =
            document.createElement("div");


        tags.className =
            "tags";



        asset.tags
            .forEach(tag => {

                tags.appendChild(
                    createTagLink(tag)
                );

            });



        const count =
            document.createElement("span");


        count.className =
            "asset-count";


        count.textContent =
            "#" +
            String(asset.id)
                .padStart(
                    3,
                    "0"
                );



        footer.appendChild(
            tags
        );


        footer.appendChild(
            count
        );



        info.appendChild(
            type
        );


        info.appendChild(
            name
        );


        info.appendChild(
            description
        );


        info.appendChild(
            footer
        );



        card.appendChild(
            info
        );



        card.addEventListener(
            "click",
            () => openModal(asset)
        );



        assetGrid.appendChild(
            card
        );

    });

}



function openModal(asset) {

    currentAsset = asset;

    modalTitle.textContent =
        asset.name;


    modalType.textContent =
        asset.typeLabel;


    modalDescription.textContent =
        asset.description;
    modalAuthor.innerHTML = "";

if (asset.author) {

    const authorLink =
        document.createElement("a");

    authorLink.className =
        "author-link";

    authorLink.href =
        `index.html?author=${encodeURIComponent(
            asset.author
        )}`;

    authorLink.textContent =
        `BY ${asset.author.toUpperCase()}`;

    authorLink.addEventListener(
        "click",
        event => {
            event.stopPropagation();
        }
    );

    modalAuthor.appendChild(
        authorLink
    );

    modalAuthor.style.display =
        "block";

} else {

    modalAuthor.style.display =
        "none";

}

if (asset.notes) {

    modalNotes.textContent =
        asset.notes;

    notesSection.style.display =
        "block";

} else {

    notesSection.style.display =
        "none";

}


    modalTags.innerHTML = "";


    asset.tags.forEach(tag => {

        modalTags.appendChild(
            createTagLink(tag)
        );

    });



    modalPreview.innerHTML = "";


    if (asset.preview) {

        const image =
            document.createElement("img");


        image.src =
            asset.preview;


        image.alt =
            asset.name;


        image.className =
            "modal-image";


        modalPreview.appendChild(
            image
        );


    } else {

        const placeholder =
            document.createElement("div");


        placeholder.className =
            "modal-placeholder";


        placeholder.textContent =
            "PREVIEW";


        modalPreview.appendChild(
            placeholder
        );

    }

modalGallery.innerHTML = "";


const galleryImages =
    asset.gallery || [];


galleryImages
    .filter(image => image && image.trim())
    .forEach(imageUrl => {

        const image =
            document.createElement("img");


        image.src =
            imageUrl;

        image.alt =
            asset.name;

        image.className =
            "gallery-image";


        image.addEventListener(
            "click",
            () => {

                modalPreview.innerHTML = "";

                const mainImage =
                    document.createElement("img");

                mainImage.src =
                    imageUrl;

                mainImage.alt =
                    asset.name;

                mainImage.className =
                    "modal-image";

                modalPreview.appendChild(
                    mainImage
                );

            }
        );


        modalGallery.appendChild(
            image
        );

    });

    if (asset.source) {

        sourceButton.href =
            asset.source;


        sourceButton.style.display =
            "inline-flex";

    } else {

        sourceButton.style.display =
            "none";

    }



    if (asset.download) {

        downloadButton.href =
            asset.download;


        downloadButton.style.display =
            "inline-flex";

    } else {

        downloadButton.style.display =
            "none";

    }



    modal.classList.add(
        "open"
    );

    modalAdminActions.style.display =
    (
        currentSession &&
        currentSession.user &&
        currentSession.user.id === ADMIN_USER_ID
    )
        ? "block"
        : "none";

}



function closeAssetModal() {

    modal.classList.remove(
        "open"
    );

    currentAsset = null;

    modalAdminActions.style.display =
        "none";

}



searchInput.addEventListener(
    "input",
    renderAssets
);



softwareFilter.addEventListener(
    "change",
    renderAssets
);



filterButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {


                filterButtons.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );


                activeType =
                    button.dataset.filter;


                renderAssets();

            }
        );

    }
);



closeModal.addEventListener(
    "click",
    closeAssetModal
);



modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeAssetModal();

        }

    }
);



document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            modal.classList.contains("open")
        ) {

            closeAssetModal();

        }

    }
);

function updateAuthUI(session) {

    currentSession = session;


    const isAdmin =
        Boolean(
            session &&
            session.user &&
            session.user.id === ADMIN_USER_ID
        );


    if (isAdmin) {

        loginButton.style.display =
            "none";

        logoutButton.style.display =
            "inline-flex";

        addButton.style.display =
            "inline-flex";

    } else {

        loginButton.style.display =
            "inline-flex";

        logoutButton.style.display =
            "none";

        addButton.style.display =
            "none";

    }


    modalAdminActions.style.display =
        (
            currentAsset &&
            isAdmin
        )
            ? "block"
            : "none";

}



async function initializeAuth() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Failed to get session:",
            error
        );

        updateAuthUI(null);

        return;

    }


    updateAuthUI(
        data.session
    );


    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            updateAuthUI(
                session
            );

        }
    );

}



loginButton.addEventListener(
    "click",
    () => {

        loginStatus.textContent = "";

        loginModal.classList.add(
            "open"
        );

        loginEmail.focus();

    }
);



closeLoginModal.addEventListener(
    "click",
    () => {

        loginModal.classList.remove(
            "open"
        );

    }
);



loginModal.addEventListener(
    "click",
    event => {

        ) {

            );

        }

    }
);



loginForm.addEventListener(

        event.preventDefault();

        } = await supabaseClient.auth.signInWithPassword({

logoutButton.addEventListener(

    function getTypeLabel(type, software) {

    const softwareLabels = {

        csp:
            "CLIP STUDIO PAINT",
    
        ps:
            "PHOTOSHOP",
    
        ibis:
            "IBIS PAINT X",
    
        other:
            "OTHER"
    
    };


    const typeLabels = {

        brush:
            "BRUSH",

        material:
            "MATERIAL",

        texture:
            "TEXTURE",

        "3d":
            "3D",

        other:
            "OTHER"

    };


    return (
        `${softwareLabels[software] || "OTHER"} / ` +
        `${typeLabels[type] || "OTHER"}`
    );

}

addAssetForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        addAssetStatus.textContent =
            "SAVING...";


        const tags =
            [...selectedTagValues];


        const newAsset = {

            name:
                assetName.value.trim(),

            type:
                assetType.value,

            software:
                assetSoftware.value,


            author:
                assetAuthor.value.trim() ||
                null,

            description:
                assetDescription.value.trim() ||
                null,

            notes:
                assetNotes.value.trim() ||
                null,

            tags,

            preview:
                assetPreview.value.trim() ||
                null,

            source:
                assetSource.value.trim() ||
                null,

            download:
                assetDownload.value.trim() ||
                null

        };


        try {


            /* =========================
               EDIT EXISTING ASSET
               ========================= */

            if (editingAssetId !== null) {

                const {
                    data,
                    error
                } = await supabaseClient
                    .from("assets")
                    .update(newAsset)
                    .eq(
                        "id",
                        editingAssetId
                    )
                    .select()
                    .single();


                if (error) {
                    throw error;
                }


                const index =
                    assets.findIndex(
                        asset =>
                            asset.id ===
                            editingAssetId
                    );


                if (index !== -1) {

                    assets[index] = {
                        ...data,
                        typeLabel:
                            getTypeLabel(
                                data.type,
                                data.software
                            )
                    };

                }


                addAssetStatus.textContent =
                    "ASSET UPDATED.";


            }


            /* =========================
               CREATE NEW ASSET
               ========================= */

            else {

                newAsset.gallery =
                    [];


                const {
                    data,
                    error
                } = await supabaseClient
                    .from("assets")
                    .insert(newAsset)
                    .select()
                    .single();


                if (error) {
                    throw error;
                }


                assets.push({
                    ...data,
                    typeLabel:
                        getTypeLabel(
                            data.type,
                            data.software
                        )
                });


                addAssetStatus.textContent =
                    "ASSET SAVED.";

            }


            updateTagFilter();

            renderAssets();


            editingAssetId =
                null;


            addAssetModalLabel.textContent =
                "ADD ASSET";


            saveAssetButton.textContent =
                "SAVE ASSET";


            setTimeout(
                () => {

                    addAssetModal.classList.remove(
                        "open"
                    );

                },
                500
            );


        } catch (error) {

            console.error(
                "Failed to save asset:",
                error
            );


            addAssetStatus.textContent =
                "FAILED TO SAVE ASSET.";

        }

    }
);

initializeAuth();

loadAssets();
