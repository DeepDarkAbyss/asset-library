<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rei's Asset Library</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

</head>


<body>


<header class="topbar">


    <div class="logo">

        <a
            href="index.html"
            class="logo-link"
        >

            <span class="logo-main">
                REI'S ASSET LIBRARY
            </span>

            <span class="logo-sub">
                PERSONAL ARCHIVE
            </span>

        </a>

    </div>


    <nav class="nav">

        <a
            class="nav-link active"
            href="index.html"
        >
            ASSETS
        </a>

        <a
            class="nav-link"
            href="tags.html"
        >
            TAGS
        </a>

    </nav>


    <div class="search-wrap">

        <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="SEARCH THE ARCHIVE..."
        >

    </div>


    <div class="top-actions">

    <button
        class="button"
        id="loginButton"
    >
        LOGIN
    </button>

    <button
        class="button"
        id="logoutButton"
        style="display: none;"
    >
        LOG OUT
    </button>

    <button
        class="button"
        id="addButton"
        style="display: none;"
    >
        + ADD ASSET
    </button>

</div>


</header>


<main>


    <section class="header">

        <h1 class="header-title">
            ASSET ARCHIVE
        </h1>

        <p
            class="header-subtitle"
            id="archiveSubtitle"
        >
            Brushes, materials, textures and everything else I refuse to lose.
        </p>

    </section>


    <section class="toolbar">


        <button
            class="filter-button active"
            data-filter="all"
        >
            ALL
        </button>


        <button
            class="filter-button"
            data-filter="brush"
        >
            BRUSHES
        </button>


        <button
            class="filter-button"
            data-filter="material"
        >
            MATERIALS
        </button>


        <button
            class="filter-button"
            data-filter="texture"
        >
            TEXTURES
        </button>


        <button
            class="filter-button"
            data-filter="3d"
        >
            3D
        </button>


        <select
            class="filter-select"
            id="softwareFilter"
        >

            <option value="all">
                ALL SOFTWARE
            </option>

            <option value="csp">
                CLIP STUDIO PAINT
            </option>

            <option value="ps">
                PHOTOSHOP
            </option>

            <option value="other">
                OTHER
            </option>

        </select>


        <div
            class="active-tag-filter"
            id="activeTagFilter"
        ></div>


    </section>


    <section
        class="asset-grid"
        id="assetGrid"
    ></section>


</main>


<div
    class="modal"
    id="assetModal"
>


    <div class="modal-window">


        <div class="modal-header">

            <span class="modal-label">
                ASSET DETAILS
            </span>


            <button
                class="close-button"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <div class="modal-content">


            <div class="modal-preview">

                <div
                    class="modal-main-preview"
                    id="modalPreview"
                >
                    PREVIEW
                </div>
            
                <div
                    class="gallery"
                    id="modalGallery"
                ></div>
            
            </div>


            <div class="modal-info">


                <div
                    class="modal-type"
                    id="modalType"
                ></div>


                <h2
                    class="modal-title"
                    id="modalTitle"
                ></h2>
                    <div
                    class="modal-author"
                    id="modalAuthor"
                    ></div>


                <p
                    class="modal-description"
                    id="modalDescription"
                ></p>
                <div
                      class="modal-section"
                      id="notesSection"
                    >
                    
                      <div class="modal-section-title">
                            NOTES
                     </div>
                    
                     <p
                         class="modal-notes"
                         id="modalNotes"
                    ></p>
                    
                    </div>


                <div class="modal-section">

                    <div class="modal-section-title">
                        TAGS
                    </div>


                    <div
                        class="tags"
                        id="modalTags"
                    ></div>

                </div>


                <div class="modal-section">

                    <div class="modal-section-title">
                        LINKS
                    </div>


                    <div class="modal-actions">


                        <a
                            class="button"
                            id="sourceButton"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            SOURCE
                        </a>


                        <a
                            class="button"
                            id="downloadButton"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            DOWNLOAD
                        </a>


                    </div>

                </div>


            </div>


        </div>


    </div>


</div>

    <div
    class="modal"
    id="loginModal"
>

    <div class="modal-window login-window">

        <div class="modal-header">

            <span class="modal-label">
                ADMIN ACCESS
            </span>

            <button
                class="close-button"
                id="closeLoginModal"
            >
                ×
            </button>

        </div>


        <div class="login-content">

            <form id="loginForm">

                <label class="form-label">
                    EMAIL

                    <input
                        class="form-input"
                        id="loginEmail"
                        type="email"
                        autocomplete="email"
                        required
                    >
                </label>


                <label class="form-label">
                    PASSWORD

                    <input
                        class="form-input"
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        required
                    >
                </label>


                <p
                    class="login-status"
                    id="loginStatus"
                ></p>


                <button
                    class="button login-submit"
                    type="submit"
                >
                    SIGN IN
                </button>

            </form>

        </div>

    </div>

</div>

<script>


let assets = [];

let activeType = "all";

let activeTag = new URLSearchParams(
    window.location.search
).get("tag");


if (activeTag) {

    activeTag =
        activeTag.trim().toLowerCase();

}


const searchInput =
    document.getElementById(
        "searchInput"
    );


const assetGrid =
    document.getElementById(
        "assetGrid"
    );


const softwareFilter =
    document.getElementById(
        "softwareFilter"
    );


const filterButtons =
    document.querySelectorAll(
        ".filter-button"
    );


const modal =
    document.getElementById(
        "assetModal"
    );


const closeModal =
    document.getElementById(
        "closeModal"
    );


const modalTitle =
    document.getElementById(
        "modalTitle"
    );


const modalType =
    document.getElementById(
        "modalType"
    );


const modalDescription =
    document.getElementById(
        "modalDescription"
    );
    
const modalAuthor =
    document.getElementById(
        "modalAuthor"
    );

const modalNotes =
    document.getElementById(
        "modalNotes"
    );

const notesSection =
    document.getElementById(
        "notesSection"
    );

const modalGallery =
    document.getElementById(
        "modalGallery"
    );

const modalPreview =
    document.getElementById(
        "modalPreview"
    );


const modalTags =
    document.getElementById(
        "modalTags"
    );


const sourceButton =
    document.getElementById(
        "sourceButton"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const activeTagFilter =
    document.getElementById(
        "activeTagFilter"
    );


const archiveSubtitle =
    document.getElementById(
        "archiveSubtitle"
    );


async function loadAssets() {

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("assets")
            .select("*")
            .order("id", {
                ascending: true
            });


        if (error) {
            throw error;
        }


        assets =
            data || [];


        updateTagFilter();

        renderAssets();


    } catch (error) {

        console.error(
            "Failed to load assets:",
            error
        );


        assetGrid.innerHTML = `
            <div class="no-results">
                FAILED TO LOAD ASSETS
            </div>
        `;

    }

}



function createTagLink(tag) {

    const link =
        document.createElement("a");


    link.className =
        "tag tag-link";


    link.href =
        `index.html?tag=${encodeURIComponent(tag)}`;


    link.textContent =
        tag.toUpperCase();


    link.addEventListener(
        "click",
        event => {

            event.stopPropagation();

        }
    );


    return link;

}



function createPreview(asset) {

    const container =
        document.createElement("div");


    container.className =
        "asset-preview";


    if (asset.preview) {

        const image =
            document.createElement("img");


        image.src =
            asset.preview;


        image.alt =
            asset.name;


        image.className =
            "asset-image";


        container.appendChild(
            image
        );


    } else {

        const placeholder =
            document.createElement("div");


        placeholder.className =
            "preview-placeholder";


        placeholder.textContent =
            "PREVIEW";


        container.appendChild(
            placeholder
        );

    }


    return container;

}



function updateTagFilter() {

    activeTagFilter.innerHTML = "";


    if (!activeTag) {

        archiveSubtitle.textContent =
            "Brushes, materials, textures and everything else I refuse to lose.";

        return;

    }


    archiveSubtitle.textContent =
        "Showing assets filtered by tag.";


    const label =
        document.createElement("span");


    label.className =
        "active-tag-label";


    label.textContent =
        `TAG: #${activeTag.toUpperCase()}`;


    const clear =
        document.createElement("button");


    clear.className =
        "active-tag-clear";


    clear.textContent =
        "×";


    clear.title =
        "Clear tag filter";


    clear.addEventListener(
        "click",
        clearActiveTag
    );


    label.appendChild(clear);


    activeTagFilter.appendChild(
        label
    );

}



function clearActiveTag() {

    activeTag = null;


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "tag"
    );


    window.history.pushState(
        {},
        "",
        url
    );


    updateTagFilter();

    renderAssets();

}



function renderAssets() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const software =
        softwareFilter.value;


    assetGrid.innerHTML = "";


    const filtered =
        assets.filter(asset => {


            const matchesType =
                activeType === "all" ||
                asset.type === activeType;


            const matchesSoftware =
                software === "all" ||
                asset.software === software;


            const matchesTag =
                !activeTag ||
                asset.tags.some(
                    tag =>
                        tag.trim().toLowerCase() ===
                        activeTag
                );


            const searchable = [
                asset.name,
                asset.description,
                asset.typeLabel,
                asset.software,
                ...asset.tags
            ]
                .join(" ")
                .toLowerCase();


            const matchesSearch =
                searchable.includes(
                    search
                );


            return (
                matchesType &&
                matchesSoftware &&
                matchesTag &&
                matchesSearch
            );

        });



    if (filtered.length === 0) {

        assetGrid.innerHTML = `
            <div class="no-results">
                NO ASSETS FOUND
            </div>
        `;

        return;

    }



    filtered.forEach(asset => {


        const card =
            document.createElement("article");


        card.className =
            "asset-card";



        card.appendChild(
            createPreview(asset)
        );



        const info =
            document.createElement("div");


        info.className =
            "asset-info";



        const type =
            document.createElement("div");


        type.className =
            "asset-type";


        type.textContent =
            asset.typeLabel;



        const name =
            document.createElement("h2");


        name.className =
            "asset-name";


        name.textContent =
            asset.name;



        const description =
            document.createElement("p");


        description.className =
            "asset-description";


        description.textContent =
            asset.description;



        const footer =
            document.createElement("div");


        footer.className =
            "asset-footer";



        const tags =
            document.createElement("div");


        tags.className =
            "tags";



        asset.tags
            .forEach(tag => {

                tags.appendChild(
                    createTagLink(tag)
                );

            });



        const count =
            document.createElement("span");


        count.className =
            "asset-count";


        count.textContent =
            "#" +
            String(asset.id)
                .padStart(
                    3,
                    "0"
                );



        footer.appendChild(
            tags
        );


        footer.appendChild(
            count
        );



        info.appendChild(
            type
        );


        info.appendChild(
            name
        );


        info.appendChild(
            description
        );


        info.appendChild(
            footer
        );



        card.appendChild(
            info
        );



        card.addEventListener(
            "click",
            () => openModal(asset)
        );



        assetGrid.appendChild(
            card
        );

    });

}



function openModal(asset) {

    modalTitle.textContent =
        asset.name;


    modalType.textContent =
        asset.typeLabel;


    modalDescription.textContent =
        asset.description;
    modalAuthor.textContent =
    asset.author
        ? `BY ${asset.author.toUpperCase()}`
        : "";

modalAuthor.style.display =
    asset.author
        ? "block"
        : "none";


if (asset.notes) {

    modalNotes.textContent =
        asset.notes;

    notesSection.style.display =
        "block";

} else {

    notesSection.style.display =
        "none";

}


    modalTags.innerHTML = "";


    asset.tags.forEach(tag => {

        modalTags.appendChild(
            createTagLink(tag)
        );

    });



    modalPreview.innerHTML = "";


    if (asset.preview) {

        const image =
            document.createElement("img");


        image.src =
            asset.preview;


        image.alt =
            asset.name;


        image.className =
            "modal-image";


        modalPreview.appendChild(
            image
        );


    } else {

        const placeholder =
            document.createElement("div");


        placeholder.className =
            "modal-placeholder";


        placeholder.textContent =
            "PREVIEW";


        modalPreview.appendChild(
            placeholder
        );

    }

modalGallery.innerHTML = "";


const galleryImages =
    asset.gallery || [];


galleryImages
    .filter(image => image && image.trim())
    .forEach(imageUrl => {

        const image =
            document.createElement("img");


        image.src =
            imageUrl;

        image.alt =
            asset.name;

        image.className =
            "gallery-image";


        image.addEventListener(
            "click",
            () => {

                modalPreview.innerHTML = "";

                const mainImage =
                    document.createElement("img");

                mainImage.src =
                    imageUrl;

                mainImage.alt =
                    asset.name;

                mainImage.className =
                    "modal-image";

                modalPreview.appendChild(
                    mainImage
                );

            }
        );


        modalGallery.appendChild(
            image
        );

    });

    if (asset.source) {

        sourceButton.href =
            asset.source;


        sourceButton.style.display =
            "inline-flex";

    } else {

        sourceButton.style.display =
            "none";

    }



    if (asset.download) {

        downloadButton.href =
            asset.download;


        downloadButton.style.display =
            "inline-flex";

    } else {

        downloadButton.style.display =
            "none";

    }



    modal.classList.add(
        "open"
    );

}



function closeAssetModal() {

    modal.classList.remove(
        "open"
    );

}



searchInput.addEventListener(
    "input",
    renderAssets
);



softwareFilter.addEventListener(
    "change",
    renderAssets
);



filterButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {


                filterButtons.forEach(
                    item =>
                        item.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );


                activeType =
                    button.dataset.filter;


                renderAssets();

            }
        );

    }
);



closeModal.addEventListener(
    "click",
    closeAssetModal
);



modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal
        ) {

            closeAssetModal();

        }

    }
);



document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            modal.classList.contains("open")
        ) {

            closeAssetModal();

        }

    }
);



loadAssets();


</script>


</body>

</html>
